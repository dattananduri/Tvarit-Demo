spring.application.name=TvaritFinal
server.port=8084

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/TvaritFinal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security / JWT
tvarit.jwt.secret=YOUR_BASE64_OR_HEX_256BIT_SECRET_KEY_HERE
tvarit.jwt.expiration-ms=86400000

# Razorpay (Optional - development mock mode active if omitted)
tvarit.razorpay.key-id=YOUR_RAZORPAY_KEY_ID
tvarit.razorpay.key-secret=YOUR_RAZORPAY_KEY_SECRET

# Google Maps (Optional - fallback vector visualizer active if omitted)
tvarit.google-maps.api-key=YOUR_GOOGLE_MAPS_API_KEY
