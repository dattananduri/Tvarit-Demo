spring.application.name=TvaritFinal
server.port=${PORT:8084}

# Database Configuration with Environment Variable Support
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/TvaritFinal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (at least 256-bit secret key)
tvarit.jwt.secret=${JWT_SECRET:}
tvarit.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Razorpay Configuration (Mock mode active if keys not set)
tvarit.razorpay.key-id=${RAZORPAY_KEY_ID:}
tvarit.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Google Maps API Key
tvarit.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}

# AI Configuration (Gemini / OpenAI for Live Vision & NLP extraction)
tvarit.gemini.api-key=${GEMINI_API_KEY:}
tvarit.openai.api-key=${OPENAI_API_KEY:}